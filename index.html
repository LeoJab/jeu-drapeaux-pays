<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Drapeaux – Le Jeu</title>
<meta name="theme-color" content="#2433f2">
<script src="/_sdk.js"></script>
<style>
@font-face{font-family:"Lilita";src:url(fonts/lilita.woff) format("woff");font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito.woff) format("woff");font-weight:200 1000;font-display:swap}
:root{
  --blue:#2433f2;--blue2:#1b27c9;--yellow:#ffd426;--ink:#12102b;--white:#fff;
  --green:#2bd96b;--red:#ff4d5e;--pink:#ff6ad5;--orange:#ff8a1f;--cyan:#3be3ff;--paper:#fff8e1;
  --sh:4px 4px 0 var(--ink);--sh2:6px 6px 0 var(--ink);--b:3px solid var(--ink);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--blue);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:800;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden;
  background:
   repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 22px,transparent 22px 44px),
   radial-gradient(circle at 50% 30%,#3442ff 0,var(--blue) 55%,var(--blue2) 100%);
  background-size:62px 62px,100% 100%;animation:bgmove 6s linear infinite}
@keyframes bgmove{to{background-position:62px 0,0 0}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit}
.h{font-family:"Lilita","Arial Black",Impact,sans-serif;font-weight:400;letter-spacing:.5px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.screen.on{display:flex;animation:screenIn .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes screenIn{from{opacity:0;transform:scale(.96) translateY(10px)}}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{width:100%;max-width:720px}

/* ---------- briques ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--yellow);border:var(--b);border-radius:14px;
  box-shadow:var(--sh);padding:14px 22px;font-family:"Lilita",sans-serif;font-size:22px;letter-spacing:.5px;transition:transform .08s,box-shadow .08s;position:relative}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.white{background:var(--white)}.btn.pink{background:var(--pink)}.btn.green{background:var(--green)}.btn.cyan{background:var(--cyan)}
.btn.sm{font-size:16px;padding:8px 14px;border-radius:11px}
.btn:disabled{opacity:.45;pointer-events:none}
.card{background:var(--white);border:var(--b);border-radius:var(--r);box-shadow:var(--sh2)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--white);border:var(--b);border-radius:999px;padding:5px 12px;box-shadow:3px 3px 0 var(--ink);font-size:15px;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--white);border:var(--b);box-shadow:3px 3px 0 var(--ink);font-size:20px;display:grid;place-items:center;flex:none}
.iconbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.label{color:var(--white);font-family:"Lilita",sans-serif;font-size:18px;letter-spacing:.6px;margin:18px 0 8px;text-shadow:2px 2px 0 var(--ink)}
.muted{opacity:.65;font-weight:700}
.av{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);object-fit:cover;flex:none;display:grid;place-items:center;
  font-family:"Lilita",sans-serif;color:var(--white);font-size:17px;background:#888;overflow:hidden}
.av.lg{width:64px;height:64px;font-size:28px}
.topbar{width:100%;display:flex;align-items:center;gap:10px;justify-content:space-between;max-width:900px}
.me{display:flex;align-items:center;gap:8px;background:var(--white);border:var(--b);border-radius:999px;padding:4px 14px 4px 4px;box-shadow:3px 3px 0 var(--ink);max-width:60vw}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- accueil ---------- */
#home{justify-content:space-between}
.marquee{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.22;display:flex;flex-direction:column;justify-content:space-around;transform:rotate(-8deg) scale(1.25)}
.marquee .row{display:flex;gap:22px;width:max-content;animation:mq 60s linear infinite}
.marquee .row:nth-child(2){animation-duration:75s;animation-direction:reverse}
.marquee .row:nth-child(3){animation-duration:52s}
.marquee img{height:70px;border-radius:8px;border:3px solid var(--ink)}
@keyframes mq{to{transform:translateX(-50%)}}
.hero{position:relative;text-align:center;margin-top:2vh}
.title{font-size:clamp(58px,15vw,120px);color:var(--yellow);line-height:.9;margin:0;
  text-shadow:4px 4px 0 var(--ink),8px 8px 0 rgba(18,16,43,.35);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  animation:wobble 3.2s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}
.sticker{display:inline-block;background:var(--pink);border:var(--b);box-shadow:var(--sh);padding:4px 14px;border-radius:10px;font-size:22px;transform:rotate(-4deg);margin-top:10px}
.tag{color:var(--white);margin:14px 0 0;font-size:17px;text-shadow:2px 2px 0 var(--ink)}
.homebtns{position:relative;display:flex;flex-direction:column;gap:16px;width:100%;max-width:420px;margin:auto 0}
.homebtns .btn{font-size:26px;padding:18px}
.homebtns small{display:block;font-family:"Nunito";font-weight:800;font-size:13px;opacity:.8;letter-spacing:0}
.homefoot{position:relative;color:var(--white);font-size:13px;opacity:.85;text-align:center;text-shadow:1px 1px 0 var(--ink)}
.bigflag{position:relative;width:min(40vw,190px);aspect-ratio:4/3;margin:14px auto 0;border:var(--b);border-radius:12px;box-shadow:var(--sh2);overflow:hidden;background:#fff;
  animation:spinflag 2.6s cubic-bezier(.6,0,.4,1) infinite}
.bigflag img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes spinflag{0%,70%{transform:rotateY(0)}85%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}

/* ---------- réglages ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--white);border:var(--b);border-radius:14px;box-shadow:var(--sh);padding:12px;text-align:left;transition:transform .1s;position:relative}
.opt .e{font-size:28px}.opt b{display:block;font-family:"Lilita";font-weight:400;font-size:20px;margin:2px 0}
.opt span{font-size:13px;font-weight:700;opacity:.75;line-height:1.25;display:block}
.opt.sel{background:var(--yellow);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.opt.sel::after{content:"✔";position:absolute;top:8px;right:10px;font-size:18px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--white);border:var(--b);border-radius:999px;padding:8px 14px;box-shadow:3px 3px 0 var(--ink);font-size:15px}
.chip.sel{background:var(--yellow)}
.diffs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.diff{background:var(--white);border:var(--b);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:10px 4px;text-align:center;font-family:"Lilita";font-size:17px}
.diff i{display:block;font-style:normal;font-size:22px}
.diff.sel[data-d=facile]{background:var(--green)}.diff.sel[data-d=moyen]{background:var(--yellow)}
.diff.sel[data-d=difficile]{background:var(--orange)}.diff.sel[data-d=expert]{background:var(--red);color:var(--white)}
.diff.sel{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.desc{background:var(--paper);border:var(--b);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;font-weight:700;line-height:1.35}
.recs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.footcta{position:sticky;bottom:0;padding:16px 0 4px;display:flex;gap:12px;justify-content:center;background:linear-gradient(transparent,var(--blue) 35%)}
.footcta .btn{flex:1;max-width:420px;font-size:26px}

/* ---------- en ligne / salon ---------- */
.panel{padding:18px;margin-top:14px}
.panel h3{margin:0 0 10px;font-family:"Lilita";font-weight:400;font-size:24px}
.codein{display:flex;gap:10px}
.codein input{flex:1;min-width:0;border:var(--b);border-radius:12px;padding:12px 14px;font-family:"Lilita";font-size:26px;letter-spacing:6px;text-transform:uppercase;text-align:center;box-shadow:inset 3px 3px 0 rgba(0,0,0,.08)}
.roomcode{font-family:"Lilita";font-size:clamp(46px,14vw,78px);letter-spacing:10px;line-height:1;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pl{display:flex;align-items:center;gap:8px;background:var(--white);border:var(--b);border-radius:12px;padding:6px 10px;box-shadow:3px 3px 0 var(--ink);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.crown{font-size:16px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.wait{color:var(--white);text-align:center;margin:16px 0;font-size:17px;text-shadow:2px 2px 0 var(--ink)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.ro{pointer-events:none}
.ro .sel{opacity:1}.ro > *:not(.sel){opacity:.45}

/* ---------- jeu ---------- */
#game{padding-top:max(10px,env(safe-area-inset-top));gap:8px}
.hud{width:100%;max-width:900px;display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.hud .grow{flex:1}
.hud .pill{font-size:16px;padding:5px 10px}
#hScore b{font-family:"Lilita";font-weight:400;font-size:20px;min-width:2ch;display:inline-block}
#hStreak{transition:transform .2s}
#hStreak.hot{background:var(--orange);animation:pulse .6s ease-in-out infinite alternate}
#hStreak.fire{background:var(--red);color:var(--white);animation:pulse .35s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12) rotate(-3deg)}}
#hClock.low{background:var(--red);color:var(--white);animation:pulse .5s infinite alternate}
.hearts{letter-spacing:2px}
.heartbreak{animation:hb .6s}
@keyframes hb{30%{transform:scale(1.6) rotate(-15deg)}60%{transform:scale(.8)}}
.stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;position:relative}
.qnum{color:var(--white);font-family:"Lilita";font-size:18px;text-shadow:2px 2px 0 var(--ink);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.ebadge{background:var(--pink);border:var(--b);border-radius:8px;padding:1px 8px;font-size:14px;color:var(--ink);text-shadow:none;font-family:Nunito;font-weight:900;animation:pop .4s}
.flagbox{position:relative;width:min(88vw,calc((100dvh - 380px) * 1.333),560px);min-width:180px;aspect-ratio:4/3;perspective:900px}
.flagcard{position:absolute;inset:0;border:4px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 var(--ink);background:var(--ink);overflow:hidden;transform-style:preserve-3d}
.flagcard img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform,filter}
.flagcard.enter{animation:flagIn .65s cubic-bezier(.2,1.5,.4,1)}
@keyframes flagIn{0%{transform:rotateY(-100deg) scale(.4) translateY(-40px);opacity:0}100%{transform:none;opacity:1}}
.flagcard.good{box-shadow:0 0 0 6px var(--green),8px 8px 0 6px var(--ink);animation:goodBounce .5s}
.flagcard.bad{box-shadow:0 0 0 6px var(--red),8px 8px 0 6px var(--ink)}
@keyframes goodBounce{40%{transform:scale(1.07) rotate(2deg)}}
.flagbox.hot .flagcard{box-shadow:0 0 22px 6px var(--orange),8px 8px 0 var(--ink)}
.flagbox.fire .flagcard{animation:fireGlow .5s ease-in-out infinite alternate}
@keyframes fireGlow{from{box-shadow:0 0 18px 6px var(--orange),8px 8px 0 var(--ink)}to{box-shadow:0 0 40px 14px var(--red),8px 8px 0 var(--ink)}}
.flagbox .flames{position:absolute;left:0;right:0;bottom:-18px;display:none;justify-content:space-around;font-size:30px;pointer-events:none;z-index:2}
.flagbox.fire .flames{display:flex}
.flames span{animation:flame .5s ease-in-out infinite alternate}
.flames span:nth-child(2n){animation-delay:.25s}
@keyframes flame{to{transform:translateY(-10px) scale(1.2)}}
.timer{width:min(88vw,560px);height:16px;border:3px solid var(--ink);border-radius:999px;background:rgba(255,255,255,.35);margin-top:16px;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.timer i{display:block;height:100%;width:100%;background:var(--green);transform-origin:left;border-right:3px solid var(--ink)}
.timer.hide{visibility:hidden}
.answers{width:100%;max-width:640px;padding-bottom:6px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{background:var(--white);border:var(--b);border-radius:14px;box-shadow:var(--sh);padding:12px 8px;min-height:62px;font-family:"Lilita";font-size:clamp(16px,4.4vw,22px);line-height:1.1;transition:transform .08s;animation:ansIn .4s cubic-bezier(.2,1.5,.4,1) backwards}
.ans:nth-child(2){animation-delay:.05s}.ans:nth-child(3){animation-delay:.1s}.ans:nth-child(4){animation-delay:.15s}
@keyframes ansIn{from{transform:translateY(30px) scale(.8);opacity:0}}
.ans:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.ans.ok{background:var(--green);animation:okPop .5s}
.ans.no{background:var(--red);color:var(--white);animation:shakeX .4s}
.ans.dim{opacity:.4}
@keyframes okPop{40%{transform:scale(1.08)}}
.typein{display:flex;gap:8px}
.typein input{flex:1;min-width:0;border:var(--b);border-radius:14px;padding:12px 14px;font-family:"Lilita";font-size:22px;box-shadow:var(--sh);outline:none}
.typein input:focus{background:#fffbe8}
.typein input.no{animation:shakeX .4s;background:#ffd6da}
.typein input.ok{background:#c9f7d9}
.tries{color:var(--white);text-align:center;font-size:14px;margin-top:8px;text-shadow:1px 1px 0 var(--ink);min-height:20px}
.hint{font-family:"Lilita";letter-spacing:4px;color:var(--yellow);font-size:20px;text-shadow:2px 2px 0 var(--ink)}
@keyframes shakeX{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.waitmsg{color:var(--white);text-align:center;font-size:18px;text-shadow:2px 2px 0 var(--ink);padding:10px}
.strip{width:100%;max-width:900px;display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pchip{display:flex;align-items:center;gap:6px;background:var(--white);border:var(--b);border-radius:999px;padding:3px 10px 3px 3px;box-shadow:2px 2px 0 var(--ink);flex:none;font-size:13px;transition:background .2s}
.pchip .av{width:28px;height:28px;font-size:13px;border-width:2px}
.pchip.okk{background:var(--green)}.pchip.ko{background:#ffb3bb}
.pchip b{font-family:"Lilita";font-weight:400;font-size:15px}
.reacts{display:flex;gap:6px;justify-content:center}
.reacts button{font-size:22px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.reacts button:active{transform:scale(.85)}
.info{margin-top:14px;padding:12px 16px;width:min(88vw,560px);animation:pop .4s}
.info h4{margin:0;font-family:"Lilita";font-weight:400;font-size:24px}
.info p{margin:4px 0 0;font-weight:700}

/* ---------- révélation / classement live ---------- */
#reveal{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(18,16,43,.55);backdrop-filter:blur(3px);padding:16px}
#reveal.on{display:flex}
.rv{width:min(520px,100%);max-height:92%;display:flex;flex-direction:column;padding:16px;animation:rvIn .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes rvIn{from{transform:scale(.5) rotate(-6deg);opacity:0}}
.rvhead{display:flex;gap:12px;align-items:center}
.rvhead img{width:84px;border:3px solid var(--ink);border-radius:8px}
.rvhead h2{margin:0;font-family:"Lilita";font-weight:400;font-size:28px;line-height:1}
.rvlist{margin-top:12px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:12px;padding:5px 10px;background:var(--paper);animation:rowIn .4s backwards}
.lrow.meRow{background:var(--yellow)}
.lrow .rk{font-family:"Lilita";font-size:20px;width:28px;text-align:center}
.lrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .gain{font-family:"Lilita";color:#0a8f3c;font-size:16px}
.lrow .gain.z{color:#b0303d}
.lrow .sc{font-family:"Lilita";font-size:20px;min-width:56px;text-align:right}
.lrow .up{color:#0a8f3c;font-size:13px}.lrow .down{color:#b0303d;font-size:13px}
@keyframes rowIn{from{transform:translateX(-30px);opacity:0}}
.rvbar{height:8px;border-radius:9px;background:var(--ink);margin-top:12px;overflow:hidden}
.rvbar i{display:block;height:100%;background:var(--yellow);animation:rvbar linear forwards}
@keyframes rvbar{from{width:100%}to{width:0}}

/* ---------- fin ---------- */
#end{justify-content:flex-start}
.endtitle{font-size:clamp(44px,12vw,80px);color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);margin:6px 0 0;text-align:center;line-height:1;animation:wobble 2.5s infinite}
.bigscore{font-family:"Lilita";font-size:clamp(56px,16vw,96px);color:var(--white);text-shadow:5px 5px 0 var(--ink);text-align:center;line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.stat{text-align:center;padding:10px 4px}
.stat b{display:block;font-family:"Lilita";font-weight:400;font-size:28px}
.stat span{font-size:12px;opacity:.7}
.badge{display:block;width:max-content;margin:12px auto 0;background:var(--pink);border:var(--b);border-radius:12px;padding:6px 16px;box-shadow:var(--sh);font-family:"Lilita";font-size:22px;animation:badge 1s ease-in-out infinite alternate}
@keyframes badge{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.08)}}
.missed{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.missed div{background:var(--white);border:3px solid var(--ink);border-radius:10px;padding:4px;text-align:center;font-size:12px}
.missed img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;border:2px solid var(--ink)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:20px;min-height:250px}
.pod{display:flex;flex-direction:column;align-items:center;width:31%;max-width:150px;opacity:0}
.pod.show{animation:podIn .7s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes podIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.pod .nm{color:var(--white);text-shadow:2px 2px 0 var(--ink);margin:6px 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .step{width:100%;border:var(--b);border-bottom:0;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;font-family:"Lilita";box-shadow:var(--sh)}
.pod .step big{font-size:40px;line-height:1}
.pod.p1 .step{height:150px;background:var(--yellow)}.pod.p2 .step{height:110px;background:#dfe6ff}.pod.p3 .step{height:80px;background:#ffc58f}
.pod.p1 .av{width:76px;height:76px;box-shadow:0 0 0 4px var(--yellow),0 0 30px 10px rgba(255,212,38,.8)}
.pod .crownbig{font-size:36px;animation:wobble 1.4s infinite;height:40px}
.endbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0 10px}

/* ---------- effets ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
#fxText{position:fixed;inset:0;pointer-events:none;z-index:60;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bigtxt{position:absolute;font-family:"Lilita";font-size:clamp(44px,13vw,110px);color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  text-shadow:6px 6px 0 var(--ink);text-align:center;line-height:1;animation:bigtxt 1.2s cubic-bezier(.2,1.6,.4,1) forwards;white-space:nowrap}
.bigtxt.pink{color:var(--pink)}.bigtxt.green{color:var(--green)}.bigtxt.red{color:var(--red)}.bigtxt.white{color:var(--white)}.bigtxt.cyan{color:var(--cyan)}

const STOP = new Set(['le','la','les','l','de','du','des','d','et','the','of']);
function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’'`\-_.,()\/]/g,' ').replace(/[^a-z0-9 ]/g,'')
    .split(/\s+/).filter(w=>w && !STOP.has(w)).join(' ');
}
const ALL = RAW.trim().split('\n').map(l=>{
  const [c,n,k,t,cap,al] = l.split('|');
  const keys = new Set([n,...(al?al.split(';'):[])].map(norm).filter(Boolean));
  [...keys].forEach(x=>keys.add(x.replace(/ /g,'')));
  return {c,n,k,t:+t,cap,keys};
});
const BY = Object.fromEntries(ALL.map(x=>[x.c,x]));
const KEYOWNERS = {};
ALL.forEach(x=>x.keys.forEach(k=>(KEYOWNERS[k]=KEYOWNERS[k]||[]).push(x.c)));

function lev(a,b){
  if(a===b) return 0; const m=a.length,n=b.length; if(!m||!n) return m||n;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}
function isMatch(guess, code){
  const g = norm(guess); if(!g) return false;
  const gs = g.replace(/ /g,'');
  const keys = BY[code].keys;
  if(keys.has(g)||keys.has(gs)) return true;
  if((KEYOWNERS[g]||KEYOWNERS[gs])) return false;   // c'est exactement le nom d'un AUTRE pays
  for(const k of keys){ const tol = k.length>=9?2:k.length>=5?1:0; if(tol && lev(gs,k.replace(/ /g,''))<=tol) return true; }
  return false;
}

function poolFor(diffKey, cont){
  let tier=DIFFS[diffKey].tier, p;
  do { p=ALL.filter(x=>x.t<=tier && (cont==='all'||x.k===cont)); tier++; } while(p.length<12 && tier<=4);
  return p.map(x=>x.c);
}
function makeOptions(code, diffKey){
  const d=DIFFS[diffKey], c=BY[code], picks=[];
  const add=list=>{ for(const x of list){ if(picks.length>=3) break; if(x!==code && BY[x] && !picks.includes(x)) picks.push(x);} };
  if(d.sim){ add(shuffle(LOOKALIKE.filter(g=>g.includes(code)).flat()).filter(x=>BY[x].t<=3).slice(0,2));
             add(shuffle(ALL.filter(x=>x.k===c.k && x.t<=3).map(x=>x.c))); }
  else add(shuffle(ALL.filter(x=>x.t<=2).map(x=>x.c)));
  add(shuffle(ALL.filter(x=>x.t<=3).map(x=>x.c)));
  return shuffle([code,...picks]);
}
function makeQuestion(code, diffKey){
  const d=DIFFS[diffKey];
  const q={c:code};
  if(d.qcm) q.o=makeOptions(code,diffKey);
  if(d.effects && Math.random()<.85){ q.e=rnd(Object.keys(EFFECTS)); q.ox=Math.round(15+Math.random()*70); q.oy=Math.round(15+Math.random()*70); }
  return q;
}
function points(ms, durS, tries, streak, mult){
  const speed = durS ? 100*Math.max(0,1-ms/(durS*1000)) : Math.max(0,60-ms/80);
  const pen = Math.max(.4,1-.3*(tries-1));
  const combo = 1+Math.min(streak,10)*.1;
  return Math.round((100+speed)*pen*combo*mult);
}

    this.lock(); this.revealFlag();
    $('#flagcard').classList.add(ok?'good':'bad');
    this.cb && this.cb({ok, ms, tries:Math.max(1,this.tries), el:info.el, timeout:info.timeout, pass:info.pass});
  },
  lock(){
    $$('#answers .ans').forEach(b=>{ b.disabled=true; if(this.q && b.dataset.c===this.q.c) b.classList.add('ok'); else if(!b.classList.contains('no')) b.classList.add('dim'); });

  },
  revealFlag(){ const img=$('#flagimg'); img.classList.add('reveal-all'); img.classList.remove('fx-nb','fx-miroir'); },
  stop(){ this.done=true; cancelAnimationFrame(this.raf); FX.danger(false); }
};

function soloResult(q,r,dur){

    const pts = m.train?0:points(r.ms,dur||(m.total?null:d.time),r.tries,S.streak-1,d.mult);
    S.score+=pts; celebrateGood(r, pts, S.streak, dur);

    if(m.lives){ S.lives--; const h=$('#hearts'); if(h){ h.textContent='❤️'.repeat(Math.max(0,S.lives))+'🖤'.repeat(m.lives-Math.max(0,S.lives)); h.classList.remove('heartbreak'); void h.offsetWidth; h.classList.add('heartbreak'); } }

const M = { room:null, code:null, me:null, players:[], st:null, hostKey:null, hostTimer:null, phaseKey:null, phaseStart:0, wasHost:false,
            reported:new Set(LS.get('reported',[])), lastReact:0, myAns:null, pending:{} };
const MSET_DEFAULT = {d:'moyen', k:'all', n:15};
function isHost(){ return M.players.length && M.players[0].id===M.me; }
function profile(id){ const p=M.st&&M.st.prof&&M.st.prof[id]; const pl=M.players.find(x=>x.id===id); return {name:(p&&p.n)||(pl&&pl.name)||'Joueur', avatar:(p&&p.a)||null}; }

function renderOnline(){

   <div class="card panel"><h3>🔑 Rejoindre</h3><form class="codein" id="joinForm" autocomplete="off"><input id="code" name="code" maxlength="12" placeholder="CODE" autocapitalize="characters" autocomplete="off" spellcheck="false"><button class="btn" type="submit">GO</button></form></div>

}
function newCode(){ const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; let s=''; for(let i=0;i<4;i++) s+=L[Math.floor(Math.random()*L.length)]; return s; }

function connect(code, create){
  SFX.init(); leaveRoom(true);
  M.code=code; M.st=null; M.hostKey=null; M.phaseKey=null; M.players=[]; M.myAns=null; M.pending={};
  $('#lbCode').textContent=code; $('#lbPlayers').innerHTML=`<div class="wait dots">Connexion</div>`; $('#lbSettings').innerHTML=''; $('#lbCta').innerHTML='';
  show('lobby'); updMute();
  try{ M.room = ChadGang.join(code,{create}); }catch(e){ FX.toast('Impossible de rejoindre : '+esc(e.message||e)); show('online'); return; }
  const room=M.room;
  room.on('ready', info=>{ if(room!==M.room) return;
    M.me=info.me; M.players=info.players||[];
    room.send({t:'hello', n:ME.name, a:ME.avatar});
    if(info.last && info.last.t==='state' && info.last.s) applyState(info.last.s);
    else if(isHost()) pushState(()=>({v:0, phase:'lobby', set:{...MSET_DEFAULT, ...LS.get('mset',{})}, prof:{[M.me]:{n:ME.name,a:ME.avatar}}, sc:{}, stk:{}, ans:{}, round:0, deck:[]}), true);
    onPlayers();
  });
  room.on('players', list=>{ if(room!==M.room) return; const before=M.players.map(p=>p.id); M.players=list||[];
    const joined=M.players.filter(p=>!before.includes(p.id)&&p.id!==M.me), left=before.filter(id=>!M.players.some(p=>p.id===id));
    joined.forEach(p=>{ FX.toast(`👋 <b>${esc(p.name)}</b> débarque !`,'y'); SFX.pop(); });
    left.forEach(id=>{ FX.toast(`🚪 ${esc(profile(id).name)} est parti`); });
    onPlayers(); });
  room.on('message', (d,from)=>{ if(room!==M.room||!d) return; onMsg(d,from||{}); });
  room.on('error', msg=>{ if(room!==M.room) return; FX.toast('😬 '+esc(typeof msg==='string'?msg:'Salle introuvable ou pleine')); SFX.bad(); leaveRoom(true); show('online'); renderOnline(); });
}
function leaveRoom(silent){
  clearTimeout(M.hostTimer); QUI.stop();
  if(M.room){ try{ M.room.leave(); }catch(e){} }
  M.room=null; M.st=null; $('#reveal').classList.remove('on'); FX.fever(false);
}
function onPlayers(){
  const host=isHost();
  if(host && !M.wasHost && M.st){ M.hostKey=null; if(M.players.length>1 || M.st.phase!=='lobby') FX.toast('👑 Tu es maintenant l\'hôte','y'); }
  M.wasHost=host;
  if(M.st){ renderState(M.st); if(host) hostSchedule(); }
}
function onMsg(d,from){
  if(d.t==='state' && d.s) applyState(d.s);
  else if(d.t==='hello'){ if(isHost() && M.st){ const p=M.st.prof[from.id]; if(!p||p.n!==d.n||p.a!==d.a) pushState(s=>{ s.prof[from.id]={n:String(d.n||from.name||'Joueur').slice(0,40), a:d.a||null}; }); } }
  else if(d.t==='ans'){ if(isHost()) hostAnswer(d,from); }
  else if(d.t==='react'){ if(REACTS.includes(d.e)){ FX.emoji(d.e, from.id===M.me?'':profile(from.id).name); SFX.pop(); } }
}
function pushState(mut, fresh){
  const base = fresh? null : M.st; if(!fresh && !base) return;
  let s = fresh? mut() : JSON.parse(JSON.stringify(base));
  if(!fresh){ const r=mut(s); if(r===false) return; }
  s.v=(M.st?M.st.v:0)+1;
  applyState(s);
  try{ M.room && M.room.send({t:'state', s}, {keep:true}); }catch(e){}
}
function applyState(s){
  if(M.st && s.v<=M.st.v) return;
  const prev=M.st; M.st=s;
  const key=s.phase+':'+s.round+':'+(s.partie||'');
  if(key!==M.phaseKey){ M.phaseKey=key; M.phaseStart=performance.now(); }
  renderState(prev);
  if(isHost()) hostSchedule();
}

/* ---- logique de l'hôte ---- */
function hostSchedule(){
  const s=M.st; if(!s) return;
  const key=M.phaseKey;
  if(key===M.hostKey) { if(s.phase==='question') hostCheckAll(); return; }
  M.hostKey=key; clearTimeout(M.hostTimer);
  const since=performance.now()-M.phaseStart;
  if(s.phase==='countdown') M.hostTimer=setTimeout(()=>hostToQuestion(0), Math.max(300,3400-since));
  else if(s.phase==='question'){ const dur=DIFFS[s.set.d].time*1000+1800; M.hostTimer=setTimeout(hostToReveal, Math.max(400,dur-since)); hostCheckAll(); }
  else if(s.phase==='reveal') M.hostTimer=setTimeout(()=>{ if(M.st.round+1<M.st.deck.length) hostToQuestion(M.st.round+1); else hostToEnd(); }, Math.max(400,5200-since));
}
function hostCheckAll(){
  const s=M.st; if(!s||s.phase!=='question') return;
  const ids=M.players.map(p=>p.id);
  if(ids.length && ids.every(id=>s.ans[id])){ clearTimeout(M.hostTimer); const r=s.round; M.hostTimer=setTimeout(()=>{ if(M.st.phase==='question'&&M.st.round===r) hostToReveal(); },900); }
}
function hostStart(){
  const s=M.st; const set=s.set;
  const pool=poolFor(set.d,set.k), codes=[]; let deck=shuffle(pool);
  while(codes.length<set.n){ if(!deck.length) deck=shuffle(pool); codes.push(deck.pop()); }
  const qs=codes.map(c=>makeQuestion(c,set.d));
  pushState(s=>{ s.phase='countdown'; s.deck=qs; s.round=0; s.ans={}; s.sc={}; s.stk={}; s.partie=(M.code+'-'+Date.now().toString(36)).slice(0,64);
    M.players.forEach(p=>s.sc[p.id]=0); });
}
function hostToQuestion(r){ pushState(s=>{ s.phase='question'; s.round=r; s.ans={}; s.prevRank=rankIds(s); }); }
function hostToReveal(){ pushState(s=>{ if(s.phase!=='question') return false; s.phase='reveal'; }); }
function hostToEnd(){ pushState(s=>{ s.phase='end'; }); }
function hostAnswer(d,from){
  const s=M.st; if(!s||s.phase!=='question'||d.r!==s.round||s.ans[from.id]) return;
  const q=s.deck[s.round]; if(!q) return;
  pushState(s=>{
    const dd=DIFFS[s.set.d];
    const ok=!!d.ok && (d.c===q.c);
    const first= ok && !Object.values(s.ans).some(a=>a.ok);
    const stk=ok?((s.stk[from.id]||0)+1):0; s.stk[from.id]=stk;
    const ms=Math.max(0,Math.min(+d.ms||0,dd.time*1000));
    const p= ok? points(ms,dd.time,Math.max(1,+d.tr||1),stk-1,dd.mult)+(first?50:0) : 0;
    s.ans[from.id]={ok, ms, p, f:first?1:0, k:stk};
    s.sc[from.id]=(s.sc[from.id]||0)+p;
  });
}
function rankIds(s){ const ids=new Set([...Object.keys(s.sc||{}), ...M.players.map(p=>p.id)]); return [...ids].sort((a,b)=>(s.sc[b]||0)-(s.sc[a]||0)); }

/* ---- affichage ---- */
function renderState(prev){
  const s=M.st; if(!s) return;
  if(s.phase==='lobby'){ $('#reveal').classList.remove('on'); QUI.stop(); renderLobby(); if(!$('#lobby').classList.contains('on')) show('lobby'); updMute(); return; }
  if(s.phase==='end'){ renderMultiEnd(prev); return; }
  // en jeu
  if(!$('#game').classList.contains('on')){ show('game'); setupHud(false); $('#strip').style.display=''; renderReacts(); updMute(); }
  const dd=DIFFS[s.set.d];
  $('#hRound').textContent=`${Math.min(s.round+1,s.deck.length)}/${s.deck.length}`;
  const mySc=s.sc[M.me]||0; if(Math.round(shownScore)!==mySc) tweenScore(mySc);
  renderStrip();
  const fresh = !prev || prev.phase!==s.phase || prev.round!==s.round || prev.partie!==s.partie;
  if(s.phase==='countdown'){ if(fresh){ $('#reveal').classList.remove('on'); QUI.stop(); $('#answers').innerHTML=''; $('#qnum').textContent=''; $('#timer').classList.add('hide');
      $('#flagcard').className='flagcard'; $('#flagimg').style.opacity=0; shownScore=0; $('#hScore b').textContent='0'; updStreakHud(0);
      s.deck.slice(0,3).forEach(q=>preload(q.c)); FX.countdown(); } return; }
  if(s.phase==='question'){
    if(fresh){
      $('#reveal').classList.remove('on');
      const q=s.deck[s.round]; preload(s.deck[s.round+1]&&s.deck[s.round+1].c);
      const already=s.ans[M.me];
      M.myAns={r:s.round, partie:s.partie};
      QUI.show(q,{duration:dd.time, diffKey:s.set.d, label:`Drapeau ${s.round+1} / ${s.deck.length}`, onDone:res=>multiAnswer(q,res)});
      if(already){ QUI.finish(already.ok,{}); }
    }
    // qui vient de trouver ?
    if(prev && prev.phase==='question' && prev.round===s.round){
      for(const [id,a] of Object.entries(s.ans)){ if(!prev.ans[id] && id!==M.me){ const n=esc(profile(id).name);
        if(a.ok){ FX.toast(a.f?`⚡ <b>${n}</b> a trouvé en premier ! (${(a.ms/1000).toFixed(1)} s)`:`✅ <b>${n}</b> a trouvé`, a.f?'y':'g'); SFX.tick(); } } }
    }
    const mine=s.ans[M.me];
    if(mine && QUI.done && !$('#reveal').classList.contains('on')){
      const nb=M.players.filter(p=>!s.ans[p.id]).length;
      const wm=$('#answers .waitmsg'); const txt= nb? `⏳ En attente de ${nb} joueur${nb>1?'s':''}…` : '🎬 Révélation…';
      if(wm) wm.textContent=txt; else $('#answers').insertAdjacentHTML('beforeend',`<div class="waitmsg">${txt}</div>`);
    }
    return;
  }
  if(s.phase==='reveal'){ if(fresh) renderReveal(s); return; }
}
function multiAnswer(q,res){
  const s=M.st; if(!s||!M.myAns||M.myAns.r!==s.round||s.phase!=='question') return;
  if(s.ans[M.me]) return;
  const dd=DIFFS[s.set.d];
  M.room && M.room.send({t:'ans', r:s.round, c:q.c, ok:res.ok, ms:res.ms, tr:res.tries});
  if(res.ok){
    const stk=(s.stk[M.me]||0)+1; const est=points(res.ms,dd.time,res.tries,stk-1,dd.mult);
    const first=!Object.values(s.ans).some(a=>a.ok);
    celebrateGood(res,est+(first?50:0),stk,dd.time); updStreakHud(stk);
    if(first){ setTimeout(()=>{ FX.text('⚡ PREMIER !','cyan small',1100); },350); }
  } else { celebrateBad(res,BY[q.c]); updStreakHud(0); }
  $('#answers').insertAdjacentHTML('beforeend',`<div class="waitmsg">⏳ En attente des autres…</div>`);
}
function renderStrip(){
  const s=M.st; if(!s) return;
  const ids=rankIds(s).filter(id=>M.players.some(p=>p.id===id));
  $('#strip').innerHTML=ids.map(id=>{ const p=profile(id), a=s.ans&&s.ans[id];
    const cls = s.phase==='question'&&a ? (a.ok?'okk':'ko') : '';
    const st = s.phase==='question' ? (a? (a.ok?'✅':'❌') : '⏳') : '';
    return `<div class="pchip ${cls}">${avatar(id,p.name,p.avatar)}<span>${esc(p.name)}${id===M.me?' (toi)':''}</span><b>${fmt(s.sc[id]||0)}</b>${st}</div>`; }).join('');
}
function renderReacts(){
  const r=$('#reacts'); r.style.display='flex';
  r.innerHTML=REACTS.map(e=>`<button data-e="${e}">${e}</button>`).join('');
  r.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const now=Date.now(); if(now-M.lastReact<500) return; M.lastReact=now; try{ M.room&&M.room.send({t:'react',e:b.dataset.e}); }catch(e){} });
}
function renderReveal(s){
  QUI.stop(); if(!QUI.done){ QUI.finish(false,{timeout:true}); }
  const q=s.deck[s.round], c=BY[q.c];
  QUI.lock(); QUI.revealFlag();
  const ranks=rankIds(s).filter(id=>M.players.some(p=>p.id===id)||s.sc[id]);
  const prevRank=s.prevRank||[];
  const finders=Object.entries(s.ans).filter(([,a])=>a.ok).sort((a,b)=>a[1].ms-b[1].ms);
  const last = s.round+1>=s.deck.length;
  $('#reveal').innerHTML=`<div class="card rv">
    <div class="rvhead"><img src="${flagUrl(q.c)}" alt=""><div><div class="muted" style="font-size:13px">C'était…</div><h2>${esc(c.n)}</h2><div class="muted" style="font-size:13px">🏛️ ${esc(c.cap)}</div></div></div>
    <div class="muted" style="margin-top:10px;font-size:14px">${finders.length? `✅ ${finders.length} joueur${finders.length>1?'s ont':' a'} trouvé · le plus rapide : <b>${esc(profile(finders[0][0]).name)}</b> en ${(finders[0][1].ms/1000).toFixed(1)} s` : '💀 Personne n\'a trouvé !'}</div>
    <div class="rvlist">${ranks.map((id,i)=>{ const p=profile(id), a=s.ans[id], pr=prevRank.indexOf(id); const mv = pr<0?'':pr>i?`<span class="up">▲${pr-i}</span>`:pr<i?`<span class="down">▼${i-pr}</span>`:'';
      return `<div class="lrow ${id===M.me?'meRow':''}" style="animation-delay:${i*.07}s"><span class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</span>${avatar(id,p.name,p.avatar)}<span class="nm">${esc(p.name)} ${mv}</span>
        <span class="gain ${a&&a.ok?'':'z'}">${a? (a.ok?`+${fmt(a.p)}${a.f?' ⚡':''}${a.k>=3?' 🔥'+a.k:''}`:'✗') : '…'}</span><span class="sc">${fmt(s.sc[id]||0)}</span></div>`; }).join('')}</div>
    <div class="muted" style="margin-top:10px;font-size:13px;text-align:center">${last?'🏁 Dernier drapeau ! Podium dans un instant…':'Prochain drapeau…'}</div>
    <div class="rvbar"><i style="animation-duration:5s"></i></div></div>`;
  $('#reveal').classList.add('on'); SFX.whoosh();
  const me=s.ans[M.me];
  const myIdx=ranks.indexOf(M.me), myPrev=prevRank.indexOf(M.me);
  if(myIdx===0 && myPrev>0){ setTimeout(()=>{ FX.text('👑 EN TÊTE !','',1300); SFX.fanfare(); FX.confettiRain(1200); },500); }
  else if(!finders.length){ SFX.lose(); }
  else if(me&&me.ok){ setTimeout(()=>SFX.good(1),200); }
  if(last){ setTimeout(()=>SFX.drumroll(4.6),300); }
}
function renderMultiEnd(prev){
  const s=M.st; const first = !prev || prev.phase!=='end' || prev.partie!==s.partie;
  QUI.stop(); $('#reveal').classList.remove('on'); FX.fever(false); FX.danger(false);
  const ranks=rankIds(s).filter(id=>s.sc[id]!==undefined);
  const max=Math.max(0,...ranks.map(id=>s.sc[id]||0));
  const winners=ranks.filter(id=>(s.sc[id]||0)===max && max>0);
  const iWon=winners.includes(M.me);
  const top3=ranks.slice(0,3);
  const pod=(id,place)=>{ if(!id) return `<div class="pod p${place}"></div>`; const p=profile(id); return `<div class="pod p${place}" data-place="${place}">
     <div class="crownbig">${place===1?'👑':''}</div>${avatar(id,p.name,p.avatar,'lg')}<div class="nm">${esc(p.name)}</div><div class="step"><big>${place}</big>${fmt(s.sc[id]||0)}</div></div>`; };
  const host=isHost();
  $('#endBody').innerHTML=`
    <div class="topbar"><button class="iconbtn" data-act="leave">🚪</button><span class="pill">⚔️ Salle ${esc(M.code)} · ${DIFFS[s.set.d].e} ${DIFFS[s.set.d].label}</span><button class="iconbtn" data-act="mute">🔊</button></div>
    <h1 class="endtitle h">${iWon?'VICTOIRE !':winners.length?'C\'est fini !':'Égalité à zéro…'}</h1>
    <div class="podium">${pod(top3[1],2)}${pod(top3[0],1)}${pod(top3[2],3)}</div>
    <div class="card" style="padding:12px;margin-top:0"><div class="rvlist" style="margin-top:0">${ranks.map((id,i)=>{ const p=profile(id); return `<div class="lrow ${id===M.me?'meRow':''}"><span class="rk">${i+1}</span>${avatar(id,p.name,p.avatar)}<span class="nm">${esc(p.name)}</span><span class="sc">${fmt(s.sc[id]||0)}</span></div>`; }).join('')}</div></div>
    <div class="endbtns">${host?`<button class="btn" data-act="mReplay">🔁 Revanche !</button><button class="btn white" data-act="mLobby">⚙️ Retour au salon</button>`:`<div class="wait dots">L'hôte (${esc(profile(M.players[0]&&M.players[0].id).name)}) décide de la suite</div>`}</div>`;
  if(!$('#end').classList.contains('on')) show('end'); updMute();
  if(first){
    // podium révélé du 3e au 1er
    const order=[3,2,1]; order.forEach((pl,i)=>setTimeout(()=>{ const el=$(`.pod.p${pl}`); if(el){ el.classList.add('show'); if(pl===1){ SFX.boom(); FX.flash('#ffd426'); FX.shake(true); FX.fireworks(8); FX.confettiRain(4000); SFX.fanfare(); const [x,y]=centerOf(el); FX.burst(x,y,{n:120,speed:15}); } else SFX.pop(); } }, 400+i*900));
    if(iWon) setTimeout(()=>FX.text('🏆 VICTOIRE 🏆','',2000),2400);
    // classement du hub
    const played=ranks.filter(id=>s.sc[id]!==undefined);
    if(HUB && ChadGang.finPartie && s.partie && played.length>=2 && played.includes(M.me) && !M.reported.has(s.partie)){
      M.reported.add(s.partie); LS.set('reported',[...M.reported].slice(-50));
      ChadGang.finPartie({gagne:iWon, partie:s.partie, score:s.sc[M.me]||0}).catch(()=>{});
    }
  } else $$('.pod').forEach(e=>e.classList.add('show'));
}
function renderLobby(){
  const s=M.st, host=isHost();
  $('#lbCode').textContent=M.code;
  $('#lbCount').textContent=`(${M.players.length}/8)`;
  $('#lbPlayers').innerHTML=M.players.map((pl,i)=>{ const p=profile(pl.id); return `<div class="pl">${avatar(pl.id,p.name,p.avatar)}<span>${esc(p.name)}${pl.id===M.me?' (toi)':''}</span>${i===0?'<span class="crown" title="Hôte">👑</span>':''}</div>`; }).join('') || `<div class="wait dots">Connexion</div>`;
  const set=s.set;
  $('#lbSettings').innerHTML=`
    <div class="label">Difficulté ${host?'':'<span style="font-size:13px">(choisie par l\'hôte)</span>'}</div>
    <div class="diffs ${host?'':'ro'}" id="mDiff">${Object.entries(DIFFS).map(([k,d])=>`<button class="diff ${set.d===k?'sel':''}" data-d="${k}"><i>${d.e}</i>${d.label}</button>`).join('')}</div>
    <div class="desc">${DIFFS[set.d].desc}</div>
    <div class="label">Zone</div>
    <div class="pills ${host?'':'ro'}" id="mCont">${[['all','Monde entier'],...Object.entries(CONT)].map(([k,n])=>`<button class="chip ${set.k===k?'sel':''}" data-k="${k}">${CONT_EMOJI[k]} ${n}</button>`).join('')}</div>
    <div class="label">Nombre de drapeaux</div>
    <div class="pills ${host?'':'ro'}" id="mN">${[10,15,20,30].map(n=>`<button class="chip ${set.n===n?'sel':''}" data-n="${n}">${n}</button>`).join('')}</div>`;
  if(host){
    const upd=fn=>{ SFX.click(); pushState(s=>{ fn(s.set); LS.set('mset',s.set); }); };
    $$('#mDiff .diff').forEach(b=>b.onclick=()=>upd(st=>st.d=b.dataset.d));
    $$('#mCont .chip').forEach(b=>b.onclick=()=>upd(st=>st.k=b.dataset.k));
    $$('#mN .chip').forEach(b=>b.onclick=()=>upd(st=>st.n=+b.dataset.n));
  }
  $('#lbCta').innerHTML = host
    ? `<button class="btn green" data-act="mStart">${M.players.length<2?'🚀 Lancer (même tout seul)':'🚀 LANCER LA PARTIE'}</button>`
    : `<div class="wait dots">En attente que ${esc(profile(M.players[0]&&M.players[0].id).name)} lance la partie</div>`;
  $('#btnInvite').style.display = (HUB && ChadGang.createInvite)?'':'none';
}

/* ==========================================================================
   ACTIONS / NAVIGATION
   ========================================================================== */
let quitArm=0;
const ACTIONS = {
  mute: toggleMute,
  home(){ SFX.click(); show('home'); },
  goSolo(){ SFX.click(); renderSoloSetup(); show('solo'); updMute(); },
  goOnline(){ SFX.click(); renderOnline(); show('online'); updMute(); },
  startSolo(){ SFX.click(); startSolo(); },
  createRoom(){ SFX.click(); connect(newCode(), true); },
  copyCode(){ const t=M.code; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>FX.toast('📋 Code copié : <b>'+esc(t)+'</b>','g')).catch(()=>FX.toast('Le code : <b>'+esc(t)+'</b>')); },
  async discordInvite(){ if(!HUB||!ChadGang.createInvite) return; const b=$('#btnInvite'); b.disabled=true;
    try{ await ChadGang.createInvite({room:M.code, message:'Qui vient deviner des drapeaux ? 🌍🏁', version:DIFFS[M.st.set.d].label}); FX.toast('📣 Invitation postée sur Discord !','g'); SFX.good(); }
    catch(e){ FX.toast('😬 Invitation impossible pour le moment'); } setTimeout(()=>b.disabled=false,8000); },
  mStart(){ if(!isHost()) return; SFX.click(); hostStart(); },
  mReplay(){ if(!isHost()) return; SFX.click(); hostStart(); },
  mLobby(){ if(!isHost()) return; SFX.click(); pushState(s=>{ s.phase='lobby'; s.sc={}; s.ans={}; s.stk={}; s.deck=[]; }); },
  leave(){ SFX.click(); leaveRoom(); show('online'); renderOnline(); },
  quit(){
    const b=$('#quitBtn');
    if(Date.now()-quitArm>2500){ quitArm=Date.now(); b.classList.add('quitconfirm'); b.textContent='?'; FX.toast('Retape ✖ pour quitter la partie'); setTimeout(()=>{ b.classList.remove('quitconfirm'); b.textContent='✖'; },2500); return; }
    b.classList.remove('quitconfirm'); b.textContent='✖'; quitArm=0;
    if(M.room){ leaveRoom(); show('online'); renderOnline(); }
    else { if(S){ S.over=true; clearInterval(S.clock); S=null; } QUI.stop(); FX.fever(false); renderSoloSetup(); show('solo'); }
    updMute();
  }
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const f=ACTIONS[b.dataset.act]; if(f){ e.preventDefault(); f(); } });
document.addEventListener('keydown',e=>{
  if(!$('#game').classList.contains('on')) return;
  if(/^[1-4]$/.test(e.key) && !QUI.done){ const b=$$('#answers .ans')[+e.key-1]; if(b) QUI.pick(b); }
  if(e.key==='Enter' && $('#trNext')){ e.preventDefault(); $('#trNext').click(); }
});

/* ==========================================================================
   DÉMARRAGE
   ========================================================================== */
function buildMarquee(){
  const codes=shuffle(ALL.filter(x=>x.t<=2).map(x=>x.c));
  const row=list=>`<div class="row">${[...list,...list].map(c=>`<img src="${flagUrl(c)}" alt="" loading="lazy">`).join('')}</div>`;
  $('#marquee').innerHTML=row(codes.slice(0,14))+row(codes.slice(14,28))+row(codes.slice(28,42));
  const hero=shuffle(ALL.filter(x=>x.t<=2).map(x=>x.c)); let i=0;
  setInterval(()=>{ if($('#home').classList.contains('on')) $('#heroFlag').src=flagUrl(hero[i++%hero.length]); },2600);
}
(async function boot(){
  FX.init(); updMute(); buildMarquee();
  $('#homeFoot').textContent=`${ALL.length} drapeaux · ${ALL.filter(x=>x.t<4).length} pays + ${ALL.filter(x=>x.t===4).length} territoires`;
  await initMe();
  const code = HUB && ChadGang.room ? ChadGang.room() : null;
  if(code && /^[A-Z0-9]{4,12}$/i.test(code)) connect(code.toUpperCase(), true);
})();
</script>
